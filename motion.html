<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>力學探索實驗室</title>
<style>
/* 力學探索實驗室 — 全部樣式與色彩變數（淺色實驗室風） */
:root {
  /* 版面底色 */
  --bg: #eef2f6;
  --panel: #ffffff;
  --panel-2: #f6f9fc;
  --line: #d5dee8;
  --line-2: #b9c6d4;
  --ink: #1b2733;
  --ink-2: #4a5a6a;
  --ink-3: #7b8896;
  --brand: #1565c0;
  --brand-2: #0d47a1;
  --brand-soft: #e3effc;
  --ok: #18794e;
  --ok-soft: #e2f4ea;
  --warn: #a15c00;
  --warn-soft: #fff3dc;
  --bad: #b3261e;
  --bad-soft: #fde8e6;

  /* 色彩語意（全教具固定，不得混用）— 與 kit.js 的 Kit.C 同值 */
  --c-x: #0b63c5;   /* 位置、位移 */
  --c-v: #0a8f6a;   /* 速度 */
  --c-a: #d4500a;   /* 加速度 */
  --c-f: #7a3eb1;   /* 施力：拉力、推力、繩子張力 */
  --c-fg: #8d4a17;  /* 重力（重量、萬有引力） */
  --c-fn: #0e7490;  /* 正向力（支撐力） */
  --c-ff: #c2255c;  /* 摩擦力 */
  --c-fe: #5b7a0c;  /* 彈力 */
  --nav: #22364f;   /* 「目前在哪裡」：單元、步驟（與可以按的藍色按鈕分開） */
  --c-net: #1b2733; /* 合力 */
  --c-k: #c98a00;   /* 動能 */
  --c-u: #2f9ccb;   /* 位能 */
  --c-q: #7f8a96;
  --c-path: #b8336a; /* 路徑長（輔助色） */   /* 熱能 */

  --r: 12px;
  --shadow: 0 1px 2px rgba(27, 39, 51, .06), 0 4px 14px rgba(27, 39, 51, .06);
  --font: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", system-ui, sans-serif;
  --mono: "SF Mono", Consolas, "Cascadia Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); color: var(--ink); background: var(--bg);
  font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
em { font-style: normal; font-weight: 700; color: var(--brand-2); background: linear-gradient(transparent 62%, #ffe58a 62%); padding: 0 1px; }
h1, h2, h3, h4, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- 外殼 ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
/* 標頭一列：品牌｜區｜單元｜分頁｜紀錄 */
.topbar {
  flex: none; height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); min-height: 44px; flex: none; }
.brand img { width: 38px; height: 38px; object-fit: contain; }
.brand b { font-size: 17px; letter-spacing: .5px; white-space: nowrap; }
.zone-tag {
  font-size: 13px; font-weight: 700; color: var(--brand-2); background: var(--brand-soft);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap; flex: none;
}
.unit-nav { display: flex; gap: 5px; flex: 1 1 auto; min-width: 0; }
.unit-chip {
  flex: none; min-height: 44px; min-width: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel-2); font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; overflow: hidden;
}
.unit-chip b { font-weight: 700; flex: none; }
.unit-chip .unit-name { display: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.unit-chip[aria-current="true"] { background: var(--nav); border-color: var(--nav); color: #fff; flex: 0 1 auto; min-width: 96px; }
.unit-chip[aria-current="true"] .unit-name { display: block; font-size: 15px; }
.unit-chip:disabled { opacity: .5; cursor: default; }
.unit-chip:disabled .unit-name { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.rec-btn { flex: none; }

.btn {
  min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2);
  background: var(--panel); font-weight: 600; font-size: 15px; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translateY(1px); }
/* 三種狀態用三種樣子：實心藍＝可以按的主要動作；淡藍底加藍框＝已選取的選項；深色＝目前所在的單元或步驟 */
.btn.primary { background: var(--brand); border-color: var(--brand-2); color: #fff; box-shadow: 0 2px 0 var(--brand-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand-2); }
.btn.small { min-height: 44px; padding: 0 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-2); }

.tabs { display: flex; gap: 2px; margin-left: auto; flex: none; align-self: stretch; align-items: flex-end; }
.tab {
  min-height: 44px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px 10px 0 0;
  font-weight: 700; font-size: 15px; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--brand-2); border-bottom-color: var(--brand); background: var(--panel); }
.tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 5px; background: var(--line-2); vertical-align: 2px; }
.tab .dot.done { background: var(--ok); }

.view {
  flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 14px;
  background-image: linear-gradient(rgba(21, 101, 192, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(21, 101, 192, .035) 1px, transparent 1px);
  background-size: 24px 24px;
}
/* 內容用滿整個寬度（大螢幕由外殼等比例放大，不靠左右留白置中） */
.wrap { max-width: none; margin: 0; }

/* ---------- 通用卡片 ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; }
.card h2 { font-size: 17px; margin-bottom: 6px; }
.card h3 { font-size: 15px; margin: 8px 0 4px; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
/* 左右兩欄等高：上緣、下緣都對齊。欄內最後一張卡片負責補滿高度。 */
.split { display: grid; grid-template-columns: minmax(0, 1fr) clamp(330px, 28%, 400px); gap: 10px; align-items: stretch; }
.split > .stack > .card:last-child, .split > .stack > .fill { flex: 1 1 auto; }
.cols { display: grid; gap: 10px; align-items: stretch; }
/* 原本直接放在背景上的按鈕列、圖例、說明：由 LAB.tidy 自動加上外框，看起來屬於同一套卡片 */
.loose { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 10px; margin-top: 0; }
p.loose, .legend.loose { margin: 0; }
.seg.loose { padding: 0; box-shadow: none; }
.loose:empty, .legend:empty, .toggles:empty { display: none; }
.cols > .card, .cols > .stack > .card:last-child { min-width: 0; }
.cols > .stack > .card:last-child, .cols > .stack > .fill { flex: 1 1 auto; }
.split.wide-text { grid-template-columns: minmax(0, 1fr) clamp(380px, 32%, 460px); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-2); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-2); white-space: nowrap; }
.tag.lv { background: #eef1f5; color: var(--ink-2); }
.tag.ext { background: #f1e6fb; color: #5b2a91; }
.tag.code { font-family: var(--mono); background: transparent; border: 1px solid var(--line); color: var(--ink-3); font-weight: 500; }

.formula {
  font-family: "Cambria Math", "Times New Roman", var(--font); font-size: 19px; text-align: center;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 6px 0 8px;
}
.formula small { display: block; font: 13px var(--font); color: var(--ink-2); margin-top: 2px; }
.sym-x { color: var(--c-x); font-weight: 700; }
.sym-v { color: var(--c-v); font-weight: 700; }
.sym-a { color: var(--c-a); font-weight: 700; }
.sym-f { color: var(--c-f); font-weight: 700; }
.sym-fg { color: var(--c-fg); font-weight: 700; }
.sym-fn { color: var(--c-fn); font-weight: 700; }
.sym-ff { color: var(--c-ff); font-weight: 700; }
.sym-fe { color: var(--c-fe); font-weight: 700; }
.sym-k { color: var(--c-k); font-weight: 700; }
.sym-u { color: var(--c-u); font-weight: 700; }

details.ext { border: 1px dashed var(--line-2); border-radius: 10px; padding: 0 12px; margin-top: 8px; background: var(--panel-2); }
details.ext > summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; color: #5b2a91; cursor: pointer; list-style: none; }
details.ext > summary::-webkit-details-marker { display: none; }
details.ext > summary::before { content: "＋"; margin-right: 6px; }
details.ext[open] > summary::before { content: "－"; }
details.ext > div { padding-bottom: 10px; }

.note { border-left: 4px solid var(--brand); background: var(--brand-soft); border-radius: 0 8px 8px 0; padding: 6px 10px; font-size: 15px; }
.note.ok { border-color: var(--ok); background: var(--ok-soft); }
.note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.bad { border-color: var(--bad); background: var(--bad-soft); }

/* ---------- 認識（guided） ---------- */
/* 步驟列固定一列：放不下時，非目前的步驟自動縮短（省略號），目前的步驟永遠完整顯示 */
.steps-nav { display: flex; gap: 6px; flex-wrap: nowrap; margin-bottom: 8px; }
.step-pill {
  min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
  flex: 0 1 auto; min-width: 46px; overflow: hidden; text-overflow: ellipsis;
}
.step-pill[aria-current="true"] { flex-shrink: 0; }
.step-pill b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e7edf3; margin-right: 5px; font-size: 13px; }
.step-pill.seen b { background: var(--ok-soft); color: var(--ok); }
.step-pill[aria-current="true"] { background: var(--nav); border-color: var(--nav); color: #fff; }
.step-pill[aria-current="true"] b { background: #fff; color: var(--nav); }
.guided-text { display: flex; flex-direction: column; gap: 0; }
.guided-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }

/* ---------- POE ---------- */
.round-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.round-card { text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
.round-card b { font-size: 16px; }
.round-card .state { margin-top: auto; font-size: 13px; color: var(--ink-3); }
.round-card.done .state { color: var(--ok); font-weight: 700; }
.poe-phases { display: flex; gap: 0; margin-bottom: 8px; align-items: center; }
.poe-phase { flex: none; padding: 4px 14px; font-weight: 700; font-size: 14px; color: var(--ink-3); background: #e7edf3; }
.poe-phase:first-child { border-radius: 999px 0 0 999px; }
.poe-phase:nth-child(3) { border-radius: 0 999px 999px 0; }
.poe-phase.on { background: var(--nav); color: #fff; }
.poe-phase.past { background: var(--ok-soft); color: var(--ok); }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: left; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--panel);
  display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.5;
}
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #e7edf3; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.opt.pick { border-color: var(--brand); background: var(--brand-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
.opt .why { display: block; font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.status-line { min-height: 48px; display: flex; align-items: center; gap: 8px; font-size: 15px; }

/* ---------- 挑戰 ---------- */
.goal { display: flex; gap: 10px; align-items: center; background: var(--warn-soft); border: 1px solid #f0d49a; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.goal b { flex: none; color: var(--warn); }
.goal.passed { background: var(--ok-soft); border-color: #a9dcc0; }
.goal.passed b { color: var(--ok); }

/* ---------- 檢核 ---------- */
.quiz-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.quiz-progress { flex: 1; height: 8px; background: #e2e8ef; border-radius: 99px; overflow: hidden; min-width: 80px; }
.quiz-progress i { display: block; height: 100%; background: var(--brand); }
.quiz-q { font-size: 17px; font-weight: 600; margin: 6px 0 10px; }
.quiz-fig { max-width: 420px; margin: 0 0 10px; }
.score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.score-cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.score-cell b { display: block; font-size: 20px; }

/* ---------- kit：時間軸 ---------- */
/* 一列放完：時間軸拉桿可以縮短，把工具開關（頻閃影像、紙帶…）收在同一列；真的放不下才換列 */
.tl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tl .btn { min-width: 44px; padding: 0 8px; }
.tl input[type=range] { flex: 1 1 60px; min-width: 60px; }
.tl-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tl-tools:empty { display: none; }
.tl-tools .chip, .tl-tools .btn { padding: 0 10px; }
.tl .tl-time { font: 600 15px var(--mono); min-width: 74px; text-align: right; white-space: nowrap; }
.tl select { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); padding: 0 6px; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 44px; background: transparent; margin: 0; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: #cfd9e4; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); margin-top: -9px; }
input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: #cfd9e4; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); border: 3px solid #fff; }

/* ---------- kit：記錄器 ---------- */
.rec { display: grid; gap: 8px; }
.rec.side { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.rec-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rec-graphs { display: grid; gap: 6px; min-width: 0; }
.rec.stackg .rec-graphs { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; position: relative; }
.stage canvas, .graph canvas { display: block; width: 100%; touch-action: none; }
.graph { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--panel);
  font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip i { width: 12px; height: 12px; border-radius: 3px; background: var(--ink-3); flex: none; }
.chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-2); }
.chip[aria-pressed="false"] { color: var(--ink-3); }
.chip[aria-pressed="false"] i { opacity: .35; }

.ctrl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; }
.ctrl label { font-weight: 600; font-size: 15px; white-space: nowrap; }
.ctrl output { font: 600 15px var(--mono); min-width: 84px; text-align: right; white-space: nowrap; }
.seg { display: inline-flex; border: 1.5px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { min-height: 44px; padding: 0 14px; border: 0; background: transparent; font-weight: 600; font-size: 15px; border-right: 1px solid var(--line); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-2); font-weight: 700; box-shadow: inset 0 0 0 2px var(--brand); }
.seg button:first-child[aria-pressed="true"] { border-radius: 8px 0 0 8px; }
.seg button:last-child[aria-pressed="true"] { border-radius: 0 8px 8px 0; }
.seg button:only-child[aria-pressed="true"] { border-radius: 8px; }
.seg button:disabled { opacity: .4; cursor: default; }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.readout div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 13px; color: var(--ink-2); }
.readout b { display: block; font: 700 17px var(--mono); color: var(--ink); white-space: nowrap; }

/* ---------- kit：能量長條 ---------- */
.ebars { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding: 22px 8px 0; position: relative; border-bottom: 2px solid var(--ink-2); }
.ebar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; position: relative; }
.ebar i { display: block; width: 70%; max-width: 46px; border-radius: 5px 5px 0 0; min-height: 0; }
.ebar span { position: absolute; bottom: -44px; font-size: 13px; font-weight: 700; text-align: center; white-space: nowrap; line-height: 1.3; }
.ebar span small { display: block; font: 500 12px var(--mono); color: var(--ink-2); }
.ebars-wrap { padding-bottom: 48px; }
.ebars .total { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); height: 0; }
.ebars .total b { position: absolute; right: 2px; top: -20px; font-size: 12px; background: var(--panel); padding: 0 4px; white-space: nowrap; }

/* ---------- kit：解題卡 ---------- */
.sol { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.sol-title { background: var(--panel-2); padding: 6px 12px; font-weight: 700; border-bottom: 1px solid var(--line); }
.sol-step { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.sol-step .k { font-size: 13px; font-weight: 700; color: #fff; background: var(--ink-2); border-radius: 6px; text-align: center; padding: 1px 0; }
.sol-step.ans .k { background: var(--ok); }
.sol-step .b { font-size: 15px; }
.sol-step.hide { display: none; }
.sol-foot { display: flex; gap: 6px; padding: 6px 12px; }

/* ---------- 對話框（取代 alert／confirm） ---------- */
.modal { position: fixed; inset: 0; background: rgba(20, 30, 40, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal-box { background: var(--panel); border-radius: 14px; max-width: 760px; width: 100%; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.modal-body { padding: 12px 16px; overflow: auto; }
.modal-foot { padding: 8px 16px 12px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
table.rec-table { border-collapse: collapse; width: 100%; font-size: 14px; }
table.rec-table th, table.rec-table td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
table.rec-table th { background: var(--panel-2); position: sticky; top: 0; }
.zoomable { cursor: zoom-in; }
.zoom-box { background: #fff; border-radius: 12px; padding: 10px; max-width: 96vw; max-height: 92vh; overflow: auto; }
.zoom-box > * { width: min(92vw, 1100px); height: auto; display: block; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; z-index: 60; font-size: 14px; }

.placeholder { text-align: center; padding: 48px 16px; color: var(--ink-2); }

/* ---------- 入口頁 ---------- */
.home { max-width: 1000px; margin: 0 auto; padding: 18px 16px 28px; }
.home-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.home-hero img { width: 104px; height: 104px; object-fit: contain; flex: none; }
.home-hero h1 { font-size: 30px; letter-spacing: 1px; }
.home-hero p { color: var(--ink-2); }
.zone-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.zone-card { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; border-top: 6px solid var(--zc, var(--brand)); min-height: 260px; }
.zone-card h2 { font-size: 20px; }
.zone-card svg { width: 100%; height: 96px; }
.zone-card ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.zone-card .go { margin-top: auto; font-weight: 700; color: var(--zc, var(--brand)); }
.zone-card.off { opacity: .6; }
.home-foot { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; align-content: flex-start; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

@media (max-width: 860px) {
  .split, .split.wide-text, .rec.side { grid-template-columns: minmax(0, 1fr); }
  .zone-grid, .home-foot { grid-template-columns: 1fr; }
  .topbar { height: auto; flex-wrap: wrap; padding: 4px 10px 0; }
  .tabs { margin-left: 0; overflow-x: auto; }
}

.sym-p { color: var(--c-path); font-weight: 700; }

.steps-codes { margin-left: auto; align-self: center; flex: none; font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; padding-left: 8px; }
/* 窄螢幕（iPad 橫向）：省略品牌文字與區名，把寬度留給單元名稱與分頁 */
@media (max-width: 1180px) {
  .brand b, .zone-tag span, .rec-btn i { display: none; }
  .tab { padding: 0 9px; }
  .steps-codes { display: none; }
}

/* Kit.slider 的三種長相 */
.pickbox { min-width: 0; position: relative; }
.pickbox input[type=range] { width: 100%; display: block; }
.pickbox.pick { display: flex; flex-wrap: wrap; gap: 4px; }
.pick-btn { min-height: 44px; min-width: 46px; padding: 0 10px; border: 1.5px solid var(--line-2); border-radius: 10px; background: var(--panel); font: 600 15px var(--mono); white-space: nowrap; }
.pick-btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-2); font-weight: 700; box-shadow: inset 0 0 0 1px var(--brand); }
.pick-btn:disabled { opacity: .45; cursor: default; }
.pickbox.ticks { display: flex; align-items: center; gap: 6px; }
.pickbox .track { position: relative; flex: 1 1 auto; min-width: 0; }
.pickbox .ticks { position: absolute; left: 13px; right: 13px; bottom: 5px; height: 6px; pointer-events: none; }
.step-btn { flex: none; width: 44px; min-height: 44px; border: 1.5px solid var(--line-2); border-radius: 10px; background: var(--panel); font: 700 18px var(--mono); line-height: 1; }
.step-btn:disabled { opacity: .35; cursor: default; }
.pickbox.narrow .step-btn { display: none; }
.ctrl output.unit-only { min-width: 0; text-align: left; }
.pickbox .ticks i { position: absolute; top: 0; width: 2px; height: 6px; margin-left: -1px; background: var(--line-2); border-radius: 1px; }
.pickbox.pick { align-items: center; }
.pick-unit { font: 600 15px var(--mono); color: var(--ink-2); margin-left: 4px; white-space: nowrap; }

.rec-btn i { font-style: normal; }
/* 上下分數：關係式與公式裡的除法一律這樣排（原始字串寫 {{分子//分母}}） */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.25; margin: 0 3px; white-space: nowrap; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 5px 1px; }
.frac > span:last-child { padding: 1px 5px 0; }
.formula .frac { line-height: 1.3; }
.opt .frac, .sol-step .frac, .readout .frac, td .frac, th .frac { font-size: .92em; }
/* 力的符號（F、FN、mg、f、T…）：與公式、解題卡用同一套 */
.fsym { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 1.08em; margin-right: 3px; }
.fsym sub { font-style: normal; font-size: .7em; }
/* 固定樣式的小提醒框：單位換算（kgw 與 N）只在這種框裡出現 */
.unit-tip { border: 1px dashed var(--line-2); background: var(--panel-2); border-radius: 8px; padding: 5px 10px; font-size: 14px; color: var(--ink-2); margin: 6px 0; }
.unit-tip::before { content: "單位提醒"; font-weight: 700; color: var(--ink); margin-right: 8px; font-size: 13px; background: #e7edf3; border-radius: 6px; padding: 1px 6px; }
/* 推導：一步一行，最後的結果另外框成重點 */
.derive { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); margin: 6px 0 8px; overflow: hidden; }
.derive > div { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
.derive > div > b:first-child { width: 22px; height: 22px; border-radius: 50%; background: #e7edf3; display: grid; place-items: center; font-size: 13px; }
.derive > div.key { background: var(--warn-soft); border-bottom: 0; font-family: "Cambria Math", "Times New Roman", var(--font); font-size: 18px; }
.derive > div.key > b:first-child { background: var(--warn); color: #fff; }
.derive > div:last-child { border-bottom: 0; }

/* ---------- 概念構圖（cmap.js）：方框大小由文字決定，連線由程式量位置後才畫 ---------- */
.cmap { overflow-x: auto; }
.cmap-grid { position: relative; display: grid; gap: 16px 30px; justify-content: space-between; align-items: stretch; padding: 4px 2px 6px; }
.cmap-lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.cmap-lines .cm-e { fill: none; stroke: #6b7a8a; stroke-width: 1.8; }
.cm-node { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; max-width: 300px;
  padding: 8px 12px; border: 1.5px solid var(--line-2); border-radius: 10px; background: var(--panel); color: var(--ink);
  font: inherit; text-align: left; overflow-wrap: anywhere; line-height: 1.45; text-wrap: pretty; }
button.cm-node { cursor: pointer; min-height: 44px; }
button.cm-node:hover, button.cm-node:focus-visible { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); outline: none; }
.cm-node .cm-t { font-size: 15.5px; font-weight: 700; }
.cm-node .cm-l { font-size: 13.5px; color: var(--ink-2); }
.cm-node.has-u { padding-right: 42px; }
.cm-node .cm-u { position: absolute; top: 6px; right: 6px; font: 700 11px var(--mono); font-style: normal; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 0 5px; line-height: 16px; color: var(--ink-2); }
.cm-node.zone { justify-content: center; align-items: center; text-align: center; }
.cm-node.zone .cm-l { text-align: center; }
.cm-node.z-a { background: #e3effc; border-color: var(--c-x); }
.cm-node.z-b { background: #f1e6fb; border-color: var(--c-f); }
.cm-node.z-c { background: #fff3dc; border-color: var(--c-k); }
.cm-node.law { background: var(--nav); border-color: var(--nav); color: #fff; }
.cm-node.law .cm-l { color: #dfe8f2; }
.cm-node.law .cm-u { color: var(--ink); }
.cm-node.rel { justify-self: center; align-self: center; border: 0; background: var(--panel-2); border-radius: 999px; padding: 3px 10px; text-align: center; max-width: 8em; }
.cm-node.rel .cm-t, .cm-node.rel .cm-l { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.cmap.has-here .cm-node.dim { opacity: .5; }
.cm-node.here { border-width: 3px; border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.cm-node.law.here { border-color: var(--warn); }
.cm-node .cm-here { order: -1; align-self: flex-start; font: 700 12px var(--font); font-style: normal; background: var(--warn); color: #fff; border-radius: 6px; padding: 0 6px; line-height: 19px; margin-bottom: 2px; }
.cmap-notes { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
.cmap-notes li { margin: 2px 0; }
.home-sum { margin-top: 14px; }
.home-sum h2 { font-size: 20px; margin-bottom: 4px; }

/* 2026-11-24 使用者退件：說明文字很長時整頁被拉長、左欄空出一大塊。
 * 改成說明卡的高度跟著左欄（舞臺＋控制），文字在卡片裡捲動；上一步／下一步固定在卡片底部。
 * contain: size 讓說明卡不參與決定這一列的高度；min-height 讓左欄很矮時說明卡仍有足夠的閱讀高度。 */
.split > .card.guided-text { contain: size; overflow-y: auto; min-height: 420px; overscroll-behavior: contain; }
.guided-text .guided-foot { position: sticky; bottom: -12px; margin: 10px -14px -12px; padding: 8px 14px 12px; background: var(--panel); border-top: 1px solid var(--line); z-index: 2; }
/* 步驟按鈕平均撐滿整列，不在右邊留一大段空白；領綱代號字放大到看得清楚 */
.steps-nav .step-pill { flex: 1 1 0; }
.steps-codes { font-size: 13px; color: var(--ink-2); }
.steps-nav .step-pill[aria-current="true"] { flex: 0 0 auto; }
.guided-text > .guided-foot { margin-top: auto; }
/* 實驗台最上方的場景切換：整列導覽，按鈕平均撐滿（同認識分頁的步驟列） */
.explore-nav { margin-bottom: 8px; }
.explore-nav { flex-wrap: nowrap; }
.explore-nav > .seg { display: flex; flex: 1 1 auto; }
.explore-nav > .muted { flex: none; white-space: nowrap; }
.explore-nav > .seg > button { flex: 1 1 0; }

</style>
</head>

<script>
/* 力學探索實驗室 — core.js
 * 外殼、單元切換、活動引擎（認識 guided／探究 poe／挑戰 challenge／實驗台 explore／檢核 quiz）、學習紀錄。
 * 一般腳本（非 ES module）。單元檔以 LAB.unit({...}) 註冊，格式見 units/a3.js。
 */
(function () {
  'use strict';

  var AID_ID = 'sci-mechanics-lab';
  var KEY = 'bro:' + AID_ID + ':v1';
  var VERSION = '0.1';

  var ZONES = {
    motion: { letter: 'A', title: '直線運動', file: 'motion.html', units: ['a1', 'a2', 'a3'] },
    force: { letter: 'B', title: '力與運動', file: 'force.html', units: ['b0', 'b1', 'b2', 'b3', 'b4', 'b5'] },
    energy: { letter: 'C', title: '功與能', file: 'energy.html', units: ['c1', 'c2', 'c3', 'c4', 'c5'] }
  };
  var UNIT_NAMES = {
    a1: '時間、位置、位移與路徑長', a2: '速率、速度與 x-t／v-t 圖', a3: '加速度、等加速度運動與自由落體',
    b0: '力的複習站', b1: '牛頓第一運動定律（慣性）', b2: '牛頓第二運動定律', b3: '牛頓第三運動定律',
    b4: '圓周運動', b5: '萬有引力與重量',
    c1: '功與功率', c2: '動能、位能與力學能守恆', c3: '力矩、槓桿與靜力平衡', c4: '滑輪、輪軸與齒輪', c5: '斜面與螺旋'
  };
  var TABS = [
    { key: 'learn', label: '認識', type: 'guided' },
    { key: 'poe', label: '探究', type: 'poe' },
    { key: 'challenges', label: '挑戰', type: 'challenge' },
    { key: 'explore', label: '實驗台', type: 'explore' },
    { key: 'quiz', label: '檢核', type: 'quiz' },
    { key: 'sample', label: '場景小樣', type: 'explore' },
    { key: 'summary', label: '統整', type: 'summary' }
  ];
  var LEVELS = { 1: '提取訊息', 2: '推論', 3: '詮釋整合', 4: '比較評估' };

  /* ---------- 小工具 ---------- */
  /* 分數排版：字串裡寫 {{分子//分母}}，顯示成上下分數（全教具規則：關係式與公式的除法不橫寫 ÷）。
   * h() 的 html 會自動轉；用 text、textContent 寫進畫面的字串由 watchFrac 轉。畫布上用 Kit.text。 */
  var FR = /\{\{((?:(?!\{\{|\}\}|\/\/)[\s\S])+)\/\/((?:(?!\{\{|\}\})[\s\S])+)\}\}/;
  function fx(s) {
    s = String(s); var n = 0;
    while (s.indexOf('{{') >= 0 && FR.test(s) && n++ < 60) s = s.replace(FR, '<span class="frac"><span>$1</span><span>$2</span></span>');
    return s;
  }
  function watchFrac(root) {
    if (!window.MutationObserver) return;
    function fixText(t) {
      if (!t.parentNode || t.nodeValue.indexOf('{{') < 0 || !FR.test(t.nodeValue)) return;
      if (/^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE)$/.test(t.parentNode.nodeName)) return;
      var box = document.createElement('span');
      box.innerHTML = fx(t.nodeValue.replace(/&/g, '&amp;').replace(/</g, '&lt;'));
      var frag = document.createDocumentFragment(); while (box.firstChild) frag.appendChild(box.firstChild);
      t.parentNode.replaceChild(frag, t);
    }
    function walk(n) {
      if (n.nodeType === 3) return fixText(n);
      if (n.nodeType !== 1 || n.textContent.indexOf('{{') < 0) return;
      var w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT, null), list = [], x;
      while ((x = w.nextNode())) list.push(x);
      list.forEach(fixText);
    }

  }

    var el = document.createElement(tag), k;
    if (attrs) for (k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === 'class') el.className = attrs[k];
      else if (k === 'html') el.innerHTML = fx(attrs[k]);
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    }
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {

    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function now() { return new Date().toISOString().slice(0, 16).replace('T', ' '); }

  /* ---------- 學習紀錄 ---------- */
  var store = { acts: {}, quiz: {}, last: {} };

  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 私密模式等情況：只留在記憶體 */ } }

  var LAB = window.LAB = {
    AID_ID: AID_ID, VERSION: VERSION, ZONES: ZONES, UNIT_NAMES: UNIT_NAMES, LEVELS: LEVELS,
    units: {}, h: h, store: store, fx: fx
  };
  LAB.unit = function (def) { LAB.units[def.id] = def; };
  /* 日後補 BRO 橋接時，只要改寫這個函式（activity_start／progress／activity_complete） */
  LAB.emit = function (type, payload) { /* 這一版不對外回報 */ };

  LAB.record = function (id, patch) {
    var r = store.acts[id] || (store.acts[id] = { attempts: 0 });
    Object.assign(r, patch, { ts: now() });
    save();
    if (patch.done) LAB.emit('activity_complete', { activityId: id, score: r.score, maxScore: r.max, attempts: r.attempts });
    refreshDots();
    return r;
  };
  LAB.isDone = function (id) { return !!(store.acts[id] && store.acts[id].done); };

  /* ---------- 畫面生命週期：切換畫面時把動畫、監聽器收乾淨 ---------- */
  var cleanups = [];
  LAB.onCleanup = function (fn) { cleanups.push(fn); };

    var list = cleanups; cleanups = [];

  }
  /* 把函式綁在「現在」的清理清單上：非同步回呼（例如 3D 元件載入完成）裡登記的清理，才會跟著原本那一塊畫面一起清掉 */

  LAB.scope = function () {

  /* ---------- 單擺場景（認識 1–3、探究 1–2、挑戰 1、實驗台共用） ----------

        var c = [h('td'), h('td'), h('td')]; cells.push(c);
        tbody.appendChild(h('tr', null, [h('td', { style: 'white-space:nowrap;font-weight:700', text: p.name || '單擺' })].concat(c)));
      });
      right.appendChild(h('div', { class: 'card', style: 'padding:4px 8px' }, h('table', { class: 'rec-table' }, [
        h('thead', null, h('tr', null, [h('th'), h('th', { text: '來回次數' }), thN, thT])), tbody])));
    }

      var ctx = c.ctx, W = c.W, H = c.H, n = pends.length, py = 46;
      ctx.fillStyle = '#f6f9fc'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#b9c6d4'; ctx.strokeStyle = '#7b8896'; ctx.lineWidth = 1;
      ctx.fillRect(W * 0.06, py - 12, W * 0.88, 8); ctx.strokeRect(Math.round(W * 0.06) + .5, py - 11.5, Math.round(W * 0.88) - 1, 7);
      ctx.font = Kit.font(13, true); ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('碼錶　t = ' + t.toFixed(2) + ' s', 10, 8);

        if (!cfg.annot) { ctx.font = Kit.font(12); ctx.fillStyle = C.ink2; ctx.fillText(fmt(p.L) + ' cm｜' + fmt(p.m) + ' 公克｜' + fmt(p.th) + '°', px, H - 14); }

  }

  /* ---------- 挑戰 1：控制變因＋調出指定週期 ---------- */
  function pendChallenge(host, api) {
    var p = { L: 100, m: 20, th: 10 }, recs = [], TARGET = 1.5, TOL = 0.02, scene, sl = {};
    var NAMES = { m: '擺錘質量', th: '擺角', L: '擺長' }, KEYS = ['m', 'th', 'L'];
    var fb = h('div', { class: 'note', text: '設定好擺長、質量、擺角後，按「放手測量」。每次只改一個變因，比較才公平。' });

    function same(a, b, k) { return a[k] === b[k]; }
    /* 兩個週期四捨五入到小數兩位後相同、實際卻不同時（例如擺長只差 1 cm），多顯示一位，避免誤判成「不影響」 */

    function diffKeys(a, b) { return KEYS.filter(function (k) { return !same(a, b, k); }); }

      return out;
    }

      var an = analyze(), hi = hit(), nOk = 0;
      checks.innerHTML = '';
      KEYS.forEach(function (k) {
        var pr = an[k], txt;
        if (pr) {
          nOk++;
          var a = recs[pr[0]], b = recs[pr[1]], eq = Math.abs(a.T - b.T) < 1e-9, tt = pair(a.T, b.T);
          txt = '✓ <b>' + NAMES[k] + '</b>：第 ' + (pr[0] + 1) + '、' + (pr[1] + 1) + ' 次只改' + NAMES[k] + ' → 週期 ' + tt[0] + ' s 與 ' + tt[1] + ' s，' + (eq ? '<b>不影響</b>' : '<b>會影響</b>');
        } else txt = '□ <b>' + NAMES[k] + '</b>：還沒有「只改' + NAMES[k] + '」的兩次測量';
        checks.appendChild(h('div', { html: txt }));
      });
      checks.appendChild(h('div', { html: hi >= 0 ? '✓ <b>目標週期 1.5 s</b>：第 ' + (hi + 1) + ' 次，擺長 ' + fmt(recs[hi].L) + ' cm，週期 ' + fmt(recs[hi].T) + ' s' : '□ <b>目標週期 1.5 s</b>（誤差 0.02 s 內）：還沒調出來' }));
      tbody.innerHTML = '';
      recs.forEach(function (r, i) {
        tbody.appendChild(h('tr', null, [String(i + 1), fmt(r.L) + ' cm', fmt(r.m) + ' 公克', fmt(r.th) + '°', fmt(10 * r.T) + ' s', fmt(r.T) + ' s'].map(function (s) { return h('td', { text: s }); })));
      });
      if (tbody.parentNode && tbody.parentNode.parentNode) tbody.parentNode.parentNode.scrollTop = 1e5;
      if (nOk === 3 && hi >= 0) {
        api.pass('三個變因都做了公平的比較，並用擺長 ' + fmt(recs[hi].L) + ' cm 調出週期 ' + fmt(recs[hi].T) + ' s');
        fb.className = 'note ok';
        fb.innerHTML = '<b>過關。</b>只有<em>擺長</em>會改變週期；擺錘質量和擺角（10° 以內）都不影響。要調週期，就調擺長。';
      }
    }

        var d = diffKeys(prev, r);
        if (d.length === 0) { fb.className = 'note'; fb.innerHTML = '和上一次的條件完全相同，10 次來回一樣是 ' + fmt(10 * r.T) + ' s。'; }
        else if (d.length === 1) { fb.className = 'note ok'; fb.innerHTML = '和上一次比，只改了<b>' + NAMES[d[0]] + '</b>，是公平的比較：週期 ' + pair(prev.T, r.T)[0] + ' s → ' + pair(prev.T, r.T)[1] + ' s。'; }

      } else { fb.className = 'note'; fb.innerHTML = '第 1 次：10 次來回共 ' + fmt(10 * r.T) + ' s，週期＝' + fmt(10 * r.T) + '÷10＝<b>' + fmt(r.T) + ' s</b>。接著只改一個變因再測。'; }
      render();
    }
    scene = pendScene(host, { pends: [p], graph: false, table: false, scale: 1.9, maxL: 120, cols: '330px minmax(0,1fr)', rate: 4, onEnd: finish });
    /* 測量途中改了設定：這次測量作廢（時間軸歸零），要把「放手測量」鈕重新開放，否則會卡住 */

    scene.right.appendChild(h('div', { class: 'card stack', style: 'padding:8px 10px;gap:6px' }, [ctl,
      h('div', { class: 'row' }, [h('span', { class: 'muted', text: '擺長微調' }), h('button', { class: 'btn small', text: '−1 cm', onclick: nudge(-1) }), h('button', { class: 'btn small', text: '＋1 cm', onclick: nudge(1) }), go])]));

    scene.right.appendChild(h('div', { class: 'card', style: 'padding:4px 8px;max-height:106px;overflow:auto' }, h('table', { class: 'rec-table' }, [
      h('thead', null, h('tr', null, ['次', '擺長', '質量', '擺角', '10 次來回', '週期'].map(function (s) { return h('th', { text: s }); }))), tbody])));
    render();
  }

  /* ---------- 實驗台：單擺 ---------- */
  function pendBench(host) {

    var info = h('div', { class: 'note' });
    function say() {

      else { info.className = 'note'; info.innerHTML = '週期 T＝<b>' + fmt(p.T) + ' s</b>。改擺錘質量或擺角（10° 以內），週期都不變；改擺長才會變。'; }

    function change(k) { return function (v) { p[k] = v; scene.rebuild(); say(); }; }

    Kit.slider(ctl, { label: '擺錘質量', min: 10, max: 200, step: 10, value: p.m, unit: '公克', oninput: change('m') });

        opts: ['路徑長約 157 m，位移大小 100 m', '路徑長和位移大小都約 157 m', '路徑長 100 m，位移大小約 157 m', '路徑長約 314 m，位移大小 0 m'], ans: 0,

        steps: [{ k: '已知', html: '半徑 50 m，走半圈' }, { k: '公式', html: '路徑長＝半個圓周＝π×半徑；位移大小＝起點到終點的直線＝直徑' }, { k: '代入', html: '路徑長＝3.14×50＝157 m；位移大小＝2×50＝100 m' }, { k: '答案', html: '路徑長約 157 m，位移大小 100 m' }]

      },

          { k: '想法', html: '擺錘回到放手處的時刻，一定是自己週期的整數倍' },

        opts: ['路徑長 1300 m，位移大小 500 m', '路徑長 1300 m，位移大小 700 m', '路徑長 700 m，位移大小 500 m', '路徑長 1300 m，位移大小 1300 m'], ans: 0,
        exp: '路徑長是三段相加：1300 m。書店在家的東方 300 m、北方 400 m，直線距離是 500 m。',

<script>
/* A2 速率、速度與 x-t／v-t 圖
 * 只處理等速度與分段等速度（加速度留給 A3）。
 * 分段等速度的速度在段與段之間「瞬間改變」，Kit.motion 的速度是連續的，所以這裡自備解析模型 pcv()。
 * 結構照 a3.js：場景函式在上半，單元資料（learn／poe／challenges／explore／quiz）在下半。
 */
(function () {
  'use strict';
  var LAB = window.LAB, Kit = window.Kit, h = LAB.h, C = Kit.C, fmt = Kit.fmt;
  var CODE = 'Eb-Ⅳ-8';
  var PERSON = '#33475b', PERSON2 = '#8a5a44';

  function P() { return Array.prototype.map.call(arguments, function (s) { return s.indexOf('<div') === 0 ? s : '<p>' + s + '</p>'; }).join(''); }
  function sgn(v) { return v > 0 ? '＋' + fmt(v) : fmt(v); }

  /* ======================================================================
   * 分段等速度的解析模型
   * legs：[[秒數, 速度], ...]。x(t)、v(t)、p(t)（路徑長）都是時間的函式，不逐格累加。
   * 段與段交界的時刻，v(t) 取新的一段（與 Kit.motion 相同）。
   * ====================================================================== */
  function pcv(x0, legs) {
    var segs = [], t = 0, x = x0 || 0, path = 0;
    if (!legs.length) legs = [[0, 0]];
    legs.forEach(function (L) {
      segs.push({ t0: t, dt: L[0], v: L[1], x0: x, p0: path });
      x += L[0] * L[1]; path += Math.abs(L[0] * L[1]); t += L[0];
    });
    var T = t;
    function cl(tt) { return Kit.clamp(tt, 0, T); }
    function seg(tt) { for (var i = segs.length - 1; i > 0; i--) if (tt >= segs[i].t0 - 1e-12) return segs[i]; return segs[0]; }
    return {
      T: T, segs: segs, x0: x0 || 0,
      knots: segs.map(function (s) { return s.t0; }).concat([T]),
      x: function (tt) { tt = cl(tt); var s = seg(tt); return s.x0 + s.v * (tt - s.t0); },
      v: function (tt) { return seg(cl(tt)).v; },
      a: function () { return 0; },
      p: function (tt) { tt = cl(tt); var s = seg(tt); return s.p0 + Math.abs(s.v) * (tt - s.t0); },
      /* 人物面向：目前速度的方向；靜止時沿用上一段的方向 */
      dir: function (tt) { tt = cl(tt); for (var i = segs.length - 1; i >= 0; i--) if (segs[i].t0 <= tt + 1e-12 && segs[i].v) return segs[i].v > 0 ? 1 : -1; return 1; }
    };
  }

  /* ======================================================================
   * 舞臺：直線跑道上的人物（取向右為正）
   * ====================================================================== */
  function drawWalker(ctx, x, base, dir, sw, alpha, col) {
    var hip = base - 17, sh = base - 30, hx = x + dir * 1.5;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.strokeStyle = col || PERSON; ctx.fillStyle = col || PERSON; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x, hip); ctx.lineTo(x + sw * 9, base - 1); ctx.moveTo(x, hip); ctx.lineTo(x - sw * 9, base - 1);
    ctx.moveTo(x, hip); ctx.lineTo(hx, sh);
    ctx.moveTo(hx, sh + 2); ctx.lineTo(hx - sw * 8, sh + 12); ctx.moveTo(hx, sh + 2); ctx.lineTo(hx + sw * 8, sh + 12);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, sh - 8, 6.5, 0, 6.3); ctx.fill();
    /* 帽沿指出面向 */
    ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(hx, sh - 13); ctx.lineTo(hx + dir * 12, sh - 12); ctx.stroke();
    ctx.restore();
  }
  /* 地面與刻度，回傳位置→像素的換算函式 */
  function drawAxis(ctx, W, base, lo, hi, opts) {
    opts = opts || {};
    var L = 30, R = 30, x, st = Kit.niceStep(hi - lo, Math.max(5, Math.min(10, Math.floor(W / 70))));
    function PX(v) { return L + (W - L - R) * (v - lo) / (hi - lo); }
    ctx.fillStyle = '#eef3f8'; ctx.fillRect(0, base, W, 8);
    ctx.strokeStyle = C.ink2; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, base + .5); ctx.lineTo(W, base + .5); ctx.stroke();
    if (opts.noLabels) return PX;
    ctx.font = Kit.font(11); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = C.ink2;
    for (x = Math.ceil(lo / st - 1e-9) * st; x <= hi + 1e-9; x += st) {
      ctx.beginPath(); ctx.moveTo(PX(x) + .5, base); ctx.lineTo(PX(x) + .5, base + 8); ctx.stroke();
      ctx.fillText(fmt(x), PX(x), base + 11);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = C.x; ctx.font = Kit.font(11, true); ctx.fillText('x (m)', W - 4, base + 25);
    ctx.textAlign = 'left'; ctx.fillStyle = C.ink3; ctx.font = Kit.font(11); ctx.fillText('向右為正 →', 4, base + 25);
    return PX;
  }
  /* o：range [lo,hi]（省略時依模型自動）、strobeDt、vMax、flag()（回傳要插旗的位置或 null） */
  function walkStage(o) {
    o = o || {};
    var cache = { m: null };
    function geom(m) {
      if (cache.m === m) return cache;
      var lo, hi, rv = Kit.range(m.v, m.T, m.knots);
      if (o.range) { lo = o.range[0]; hi = o.range[1]; }
      else {
        var r = Kit.range(m.x, m.T, m.knots), st;
        lo = Math.min(0, r[0]); hi = Math.max(r[1], lo + 1); st = Kit.niceStep(hi - lo, 8);
        lo = Math.floor(lo / st - 0.3) * st; hi = Math.ceil(hi / st + 0.3) * st;
      }
      cache = { m: m, lo: lo, hi: hi, vMax: o.vMax || Math.max(Math.abs(rv[0]), Math.abs(rv[1]), 1) };
      return cache;
    }
    return function (ctx, s, W, H) {
      var m = s.model, g = geom(m), base = H - 40, i, PX = drawAxis(ctx, W, base, g.lo, g.hi), dt = o.strobeDt || 1, hasBack = false;
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, base + 1); ctx.clip();
      /* 頻閃：每 dt 秒留下一個淡淡的人影 */
      if (s.show && s.show.strobe) {
        /* 頻閃：每個時刻都留下一個人影（不可省略，間距才看得出規律），腳下另有位置記號 */
        for (i = 0; i * dt <= s.t + 1e-9; i++) {
          var gx = PX(m.x(i * dt)), back = m.v(i * dt) < -1e-9 || (Math.abs(m.v(i * dt)) < 1e-9 && m.dir(i * dt) < 0);
          if (back) hasBack = true;
          /* 去程與回程的人影用不同顏色（右上角有圖例） */
          drawWalker(ctx, gx, base, m.dir(i * dt), 0.3, back ? 0.5 : 0.42, back ? C.back : C.go);
          ctx.fillStyle = back ? C.back : C.x; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(gx, base + 4, 2.6, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1;
        }
      }
      if (hasBack) { ctx.restore(); Kit.goBackLegend(ctx, W - 10, 14); ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, base + 1); ctx.clip(); }
      /* 預測的旗子 */
      var fx = o.flag ? o.flag() : null;
      if (fx != null) {
        var px = PX(fx);
        ctx.strokeStyle = '#b3261e'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(px, base); ctx.lineTo(px, base - 46); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#b3261e'; ctx.beginPath(); ctx.moveTo(px, base - 46); ctx.lineTo(px + 16, base - 40); ctx.lineTo(px, base - 34); ctx.closePath(); ctx.fill();
      }
      var p = m.p ? m.p(s.t) : s.x, sw = s.v ? Math.sin(p * 2.2) * 0.55 : 0.18;
      drawWalker(ctx, PX(s.x), base, m.dir ? m.dir(s.t) : 1, sw, 1);
      ctx.restore();
      /* 速度箭頭：長度與速度成比例 */
      /* 人物靠近畫面邊緣時把整支箭頭往內平移，箭頭尖端不會被邊框切掉 */
      var cx = PX(s.x), vy = Math.max(base - 60, 38), tip = cx + s.v / g.vMax * 80, sh = tip < 10 ? 10 - tip : tip > W - 10 ? W - 10 - tip : 0;
      Kit.arrow(ctx, cx + sh, vy, tip + sh, vy, C.v, { label: 'v = ' + fmt(s.v) + ' m/s', bounds: [0, W] });
      ctx.font = Kit.font(13, true); ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('t = ' + s.t.toFixed(2) + ' s　x = ' + fmt(s.x) + ' m', 10, 8);
      if (fx != null) { ctx.textAlign = 'right'; ctx.fillStyle = '#b3261e'; ctx.fillText('紅旗＝你預測的終點 x＝' + fmt(fx) + ' m', W - 10, 8); }
    };
  }

  /* 記錄器上另加一張 v-t 圖：A2 不談加速度，「斜率三角形」只用在 x-t 圖，所以 v-t 圖不交給記錄器的工具列。
   * 呼叫端在 onTick 裡呼叫回傳物件的 draw(state)。 */
  function extraV(rec, hh) {
    var g = Kit.graph(rec.graphs[0].el.parentNode, {
      kind: 'v', model: rec.state.model, T: rec.state.model.T, h: hh,
      onScrub: function (t) { rec.tl.pause(); rec.tl.set(t); }
    });
    return {
      draw: function (s) { g.draw(s.t, { area: s.show.area }); },
      set: function (m) { g.set({ model: m, T: m.T }); }
    };
  }

  /* 共用的讀數：路徑長、位移、平均速率、平均速度（全部由同一個模型算出） */
  function avgReadout(host) {
    var cells = {}, box = h('div', { class: 'readout' });
    [['t', '經過時間'], ['p', '<span class="sym-p">路徑長</span>'], ['d', '<span class="sym-x">位移</span>'], ['sp', '平均速率'], ['vel', '<span class="sym-v">平均速度</span>']].forEach(function (k) {
      var b = h('b', { text: '—' }); cells[k[0]] = b;
      box.appendChild(h('div', null, [h('span', { html: k[1] }), b]));
    });
    host.appendChild(box);
    return function (s) {
      var m = s.model, t = s.t, p = m.p(t), d = m.x(t) - m.x(0);
      cells.t.textContent = fmt(t) + ' s'; cells.p.textContent = fmt(p) + ' m'; cells.d.textContent = fmt(d) + ' m';
      cells.sp.textContent = t > 1e-9 ? fmt(p / t) + ' m/s' : '—';
      cells.vel.textContent = t > 1e-9 ? fmt(d / t) + ' m/s' : '—';
    };
  }

  /* ======================================================================
   * 題目用的靜態圖（SVG 字串）：分段等速度的速度會跳動，Kit.figure 不能畫，這裡自畫，樣式比照 Kit.graph
   * o：kind 'x'|'v'、lines:[{m, dash, name}]、T、y:[下限, 上限, 間隔]、label（給螢幕報讀）
   * ====================================================================== */
  function svgGraph(o) {
    var W = 420, H = o.h || 210, M = { l: 44, r: 38, t: 30, b: 26 }, K = Kit.KIND[o.kind], T = o.T;
    var yLo = o.y[0], yHi = o.y[1], yStep = o.y[2], tStep = o.tStep || Kit.niceStep(T, 5), s = [], v;
    var FF = 'font-family="PingFang TC,Microsoft JhengHei,Noto Sans TC,sans-serif"';
    function X(t) { return (M.l + (W - M.l - M.r) * t / T).toFixed(1); }
    function Y(y) { return (H - M.b - (H - M.t - M.b) * (y - yLo) / (yHi - yLo)).toFixed(1); }
    s.push('<svg class="zoomable" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + o.label + '" style="display:block;background:#fff;border:1px solid ' + C.line + ';border-radius:10px">');
    for (v = yLo; v <= yHi + 1e-9; v += yStep) {
      s.push('<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + C.grid + '"/>');
      s.push('<text x="' + (M.l - 5) + '" y="' + Y(v) + '" ' + FF + ' font-size="11" fill="' + C.ink2 + '" text-anchor="end" dominant-baseline="middle">' + fmt(v) + '</text>');
    }
    for (v = 0; v <= T + 1e-9; v += tStep) {
      s.push('<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + M.t + '" y2="' + (H - M.b) + '" stroke="' + C.grid + '"/>');

  /* ======================================================================
   * 自畫圖表（挑戰「照圖走」用：目標線要一直完整顯示，學生的線只畫到目前時刻）
   * o：T、y:[下限,上限,間隔]、kind、lines:[{f,t1,knots,dash,alpha,w}]、band:{f,tol,knots}、cursor、right（右上讀數）、hints

    for (v = yLo; v <= yHi + 1e-9; v += yStep) {
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(M.l, Math.round(Y(v)) + .5); ctx.lineTo(W - M.r, Math.round(Y(v)) + .5); ctx.stroke();

    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (v = 0; v <= o.T + 1e-9; v += tStep) {
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(Math.round(X(v)) + .5, M.t); ctx.lineTo(Math.round(X(v)) + .5, H - M.b); ctx.stroke();
      ctx.fillStyle = C.ink2; ctx.fillText(fmt(v), X(v), H - M.b + 5);
    }
    ctx.strokeStyle = C.ink2; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(M.l, M.t); ctx.lineTo(M.l, H - M.b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(M.l, Y(0)); ctx.lineTo(W - M.r, Y(0)); ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(hx - 3, hy - 9, tw + 6, 18);
      ctx.fillStyle = C.v; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(hn.text, hx, hy);

    o.lines.forEach(function (L) {

      pts(L.f, L.t1, L.knots).forEach(function (t, j) { var px = X(t), py = Y(L.f(t)); if (j) ctx.lineTo(px, py); else ctx.moveTo(px, py); });

    if (o.right) { ctx.textAlign = 'right'; ctx.font = Kit.font(12, true); ctx.fillStyle = o.rightColor || K.color; ctx.fillText(o.right, W - 8, 13); }
  }

  /* ======================================================================

  var DUO = [{ name: '甲', m: pcv(0, [[9, 3]]), col: PERSON, dash: null }, { name: '乙', m: pcv(12, [[9, 1]]), col: PERSON2, dash: [8, 5] }];
  function duoScene(host, api) {

  /* ======================================================================
   * 場景三：挑戰「照圖走」——學生即時控制速度，走出目標 x-t 圖
   * 即時操作時記下「何時改成什麼速度」，學生的運動因此也是分段等速度，x(t) 用同一個解析模型算；
   * 回放與比對都用記錄下來的資料。
   * ====================================================================== */
  var WALK_LV = [
    { name: '等速', legs: [[6, 2]] },
    { name: '停一下再走', legs: [[2, 3], [2, 0], [3, 2]] },
    { name: '折返', legs: [[4, 3], [3, -2]] }
  ];
  function walkChallenge(host, api) {
    var TOL = 1, lv = 0, tgt = pcv(0, WALK_LV[0].legs), events = [], vSel = 0, live = false, tNow = 0, recM = null, viewT = 0, rate = 0.5, passed = {}, hint = false, worst = null;
    var VS = [-3, -2, -1, 0, 1, 2, 3], vBtns = [], XMIN = -1, XMAX = 14;
    var left = h('div', { class: 'stack', style: 'gap:6px;min-width:0' }), right = h('div', { class: 'stack', style: 'gap:8px' });
    host.appendChild(h('div', { style: 'display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px;align-items:start' }, [left, right]));
    var stBox = h('div', { class: 'stage' }), xBox = h('div', { class: 'graph' }), vBox = h('div', { class: 'graph' });
    var tlHost = h('div', { class: 'card', style: 'padding:6px 8px;display:none' });
    left.appendChild(stBox); left.appendChild(xBox); left.appendChild(vBox); left.appendChild(tlHost);
    var stageFn = walkStage({ range: [XMIN, XMAX], vMax: 3 });
    var stC = Kit.canvas(stBox, { h: 130, draw: function (c) { drawStage(c); } });
    var xC = Kit.canvas(xBox, { h: 190, draw: function (c) { drawX(c); } });
    var vC = Kit.canvas(vBox, { h: 122, draw: function (c) { drawV(c); } });

    function studentModel() {
      if (live) return fromEvents(tNow);
      if (recM) return recM;
      return null;
    }
    function fromEvents(tEnd) {
      var legs = events.map(function (e, i) { return [(i < events.length - 1 ? events[i + 1][0] : tEnd) - e[0], e[1]]; });
      return pcv(0, legs);
    }
    function curT() { return live ? tNow : recM ? viewT : 0; }

      var m = studentModel() || pcv(0, [[0, vSel]]), t = Math.min(curT(), m.T);
      c.ctx.clearRect(0, 0, c.W, c.H);
      stageFn(c.ctx, { t: t, x: m.x(t), v: m.v(t), model: m, show: {} }, c.W, c.H);
    }
    function drawX(c) {
      var m = studentModel(), t = curT(), lines = [{ f: tgt.x, t1: tgt.T, knots: tgt.knots, dash: [8, 5], alpha: .55, w: 2.5 }], gap = null, hints = [];
      if (m) { lines.push({ f: m.x, t1: Math.min(t, m.T), knots: m.knots }); gap = Math.abs(m.x(t) - tgt.x(t)); }
      if (hint) tgt.segs.forEach(function (s) { hints.push({ t: s.t0 + s.dt / 2, y: s.x0 + s.v * s.dt / 2, text: '斜率 ' + sgn(s.v), dy: s.v < 0 ? 16 : -16 }); });
      plot(c, {
        kind: 'x', T: tgt.T, y: [-2, 14, 2], lines: lines, band: { f: tgt.x, tol: TOL, knots: tgt.knots }, cursor: t, hints: hints,
        mark: !live && worst && recM && worst.err > TOL + 1e-9 ? { t: worst.t, y: recM.x(worst.t) } : null,
        title: 'x-t 圖　虛線＝目標，色帶＝±1 m',
        right: gap == null ? '' : '目前差距 ' + fmt(gap) + ' m', rightColor: gap != null && gap > TOL ? '#b3261e' : C.x
      });
    }
    function drawV(c) {
      var m = studentModel(), t = curT(), lines = [{ f: tgt.v, t1: tgt.T, knots: tgt.knots, dash: [8, 5], alpha: .55, w: 2.5 }];
      if (m) lines.push({ f: m.v, t1: Math.min(t, m.T), knots: m.knots });
      plot(c, { kind: 'v', T: tgt.T, y: [-3, 3, 1], lines: lines, cursor: t, title: 'v-t 圖　v (m/s)', right: m ? '你的速度 ' + fmt(m.v(t)) + ' m/s' : '' });
    }
    function paint() {
      stC.redraw(); xC.redraw(); vC.redraw();
      vBtns.forEach(function (b, i) { b.className = 'btn'; b.setAttribute('aria-pressed', VS[i] === vSel ? 'true' : 'false'); });
    }
    /* 右側控制 */
    var lvSeg = Kit.seg(WALK_LV.map(function (L, i) { return { v: i, label: (i + 1) + ' ' + L.name }; }), 0, function (v) { if (!live) { lv = v; reset(); } else lvSeg.set(lv); });
    var vGrid = h('div', { style: 'display:grid;grid-template-columns:repeat(4,1fr);gap:6px' });
    VS.forEach(function (v) {
      var b = h('button', { class: 'btn', style: 'padding:0 4px', text: v === 0 ? '0 停' : sgn(v), onclick: function () { setV(v); } });
      vBtns.push(b); vGrid.appendChild(b);
    });
    var go = h('button', { class: 'btn primary', style: 'width:100%', text: '▶ 開始走', onclick: start });
    var rateSeg = Kit.seg([{ v: 0.5, label: '慢動作 ½' }, { v: 1, label: '正常速度' }], rate, function (v) { rate = v; });
    var hintBtn = h('button', { class: 'chip', 'aria-pressed': 'false', text: '提示：每段的斜率', onclick: function () { hint = !hint; hintBtn.setAttribute('aria-pressed', hint ? 'true' : 'false'); paint(); } });
    var result = h('div', { class: 'note' }), tbody = h('div', { class: 'muted' });
    right.appendChild(h('div', { class: 'card stack', style: 'padding:8px 10px;gap:8px' }, [
      lvSeg,
      h('div', null, [h('b', { html: '<span class="sym-v">速度</span>（m/s，向右為正）' }), h('div', { class: 'muted', text: '走路中隨時按，人物會立刻改成這個速度。' })]),
      vGrid, go, h('div', { class: 'row' }, [rateSeg, hintBtn]), result, tbody
    ]));
    function table() {
      tbody.innerHTML = '<b>過關紀錄</b>（最大差距）　' + WALK_LV.map(function (L, i) { return (i + 1) + '：' + (passed[i] != null ? fmt(passed[i]) + ' m ✓' : '—'); }).join('｜');
    }
    function setV(v) {
      vSel = v;
      if (live && events[events.length - 1][1] !== v) {
        if (Math.abs(events[events.length - 1][0] - tNow) < 1e-9) events[events.length - 1][1] = v; else events.push([tNow, v]);
      }
      paint();
    }
    function reset() {
      tgt = pcv(0, WALK_LV[lv].legs); live = false; recM = null; events = []; tNow = 0; viewT = 0; worst = null; vSel = 0;
      tlHost.style.display = 'none'; tl.setT(tgt.T);
      go.disabled = false; go.textContent = '▶ 開始走';
      result.className = 'note'; result.innerHTML = '先看虛線：每一段該用多快、往哪走？選好出發的速度，再按「開始走」。';

    }
    function start() {
      api.attempt();

      live = false; tNow = tgt.T;

      var ts = [], t, maxE = 0, tw = 0;
      for (t = 0; t <= tgt.T + 1e-9; t += 0.01) ts.push(t);
      recM.knots.concat(tgt.knots).forEach(function (k) { ts.push(Math.max(0, k - 1e-7)); ts.push(k); });
      ts.forEach(function (tt) { var e = Math.abs(recM.x(tt) - tgt.x(tt)); if (e > maxE) { maxE = e; tw = tt; } });
      worst = { t: tw, err: maxE };
      var ok = maxE <= TOL + 1e-9;
      if (ok) {
        if (passed[lv] == null || maxE < passed[lv]) passed[lv] = maxE;
        result.className = 'note ok';
        result.innerHTML = '<b>過關！</b>全程最大差距 ' + fmt(maxE) + ' m。' + (lv < WALK_LV.length - 1 ? '換下一關試試。' : '');
      } else {
        result.className = 'note warn';
        result.innerHTML = '在 t＝' + fmt(tw) + ' s 差了 ' + fmt(maxE) + ' m（紅點），超出 ±1 m。看那一段虛線的斜率，再走一次。';
      }
      table();
      go.disabled = false; go.textContent = '↺ 再走一次';
      tlHost.style.display = ''; tl.setT(tgt.T); tl.set(tgt.T);
      if (Object.keys(passed).length === WALK_LV.length) {
        api.pass('三關最大差距：' + WALK_LV.map(function (L, i) { return fmt(passed[i]) + ' m'; }).join('、'));
        result.innerHTML += '<br><b>三關全部完成。</b>x-t 圖的斜率就是你按的速度；水平段是停下，往下的段是往回走。';
      }

    }

      if (!live) return;
      tNow = Math.min(tNow + dt * rate, tgt.T);
      /* 走到跑道盡頭就停住（算出剛好到盡頭的時刻），人物與圖線都不會跑出畫面 */
      var x = fromEvents(tNow).x(tNow), last = events[events.length - 1];

          { k: '位置', html: 'x＝4×10＝40 m；檢查乙：30＋1×10＝40 m ✓' },

      {

        q: '附圖是某人沿直線運動的 x-t 圖（向右為正）。求 0–10 s 全程的平均速率與平均速度。' + svgGraph({ kind: 'x', lines: [{ m: QM.e2 }], T: 10, tStep: 1, y: [-4, 12, 4], label: 'x-t 圖：0 到 4 秒由 0 升到 12 公尺，4 到 6 秒維持 12 公尺，6 到 10 秒降到負 4 公尺' }),
        opts: ['平均速率 2.8 m/s，平均速度 −0.4 m/s', '平均速率 2.8 m/s，平均速度 0.4 m/s', '平均速率 2.33 m/s，平均速度 −0.4 m/s', '平均速率 3.5 m/s，平均速度 −0.5 m/s'], ans: 0,
        exp: '路徑長＝12＋16＝28 m，平均速率＝28÷10＝2.8 m/s；位移＝−4−0＝−4 m，平均速度＝−4÷10＝−0.4 m/s（向左）。',
        miss: { 1: '終點在 x＝−4 m，位移是負的，平均速度要帶負號（向左）。', 2: '2.33 是把三段速率 3、0、4 直接平均。平均速率要用{{總路徑長//總時間}}。', 3: '只用了有在走的 8 s。停下的 2 s 也是經過的時間，要算進去。' },
        steps: [

          { k: '位移', html: '−4 − 0 ＝ −4 m' },

<script>
/* A3 加速度、等加速度運動與自由落體 —— 範本單元（其他單元照這個檔的結構寫）
 * 結構：資料與文字在上半（learn／poe／challenges／quiz），場景函式在下半。
 * 活動代號：<單元>-learn、<單元>-poe-N、<單元>-ch-N、<單元>-explore、<單元>-quiz；題目代號 <單元>-qNN、延伸 <單元>-eN。
 */
(function () {
  'use strict';
  var LAB = window.LAB, Kit = window.Kit, h = LAB.h, C = Kit.C, fmt = Kit.fmt;
  var G = Kit.G, G_MOON = 1.63, CODE = 'Eb-Ⅳ-8';

  function P() { return Array.prototype.map.call(arguments, function (s) { return s.indexOf('<div') === 0 ? s : '<p>' + s + '</p>'; }).join(''); }

  /* ======================================================================
   * 場景一：自由落體塔（認識 6、探究 1、實驗台共用）
   * 位置用解析解。有空氣時用「阻力與速度成正比」的模型，同樣有解析解。
   * 取向下為正；y 是落下的距離。
   * ====================================================================== */
  function fallModel(g, H, tau) {
    var free = !isFinite(tau), vt = g * tau, tL;
    function y(t) { return free ? 0.5 * g * t * t : vt * (t - tau * (1 - Math.exp(-t / tau))); }
    if (free) tL = Math.sqrt(2 * H / g);
    else { var lo = 0, hi = 200, i, mid; for (i = 0; i < 60; i++) { mid = (lo + hi) / 2; if (y(mid) < H) lo = mid; else hi = mid; } tL = hi; }
    return {
      tL: tL,
      y: function (t) { return t >= tL ? H : y(t); },
      v: function (t) { return t >= tL ? 0 : (free ? g * t : vt * (1 - Math.exp(-t / tau))); },
      a: function (t) { return t >= tL ? 0 : (free ? g : g * Math.exp(-t / tau)); }
    };
  }
  function drawBall(ctx, x, y, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = '#56636f'; ctx.strokeStyle = '#27323c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y - 9, 9, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x - 3, y - 12, 2.6, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  function drawFeather(ctx, x, y, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y - 15); ctx.rotate(-0.45);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#5b6b7b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -3, 6, 13, 0, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, 16); ctx.stroke();
    ctx.restore();
  }
  /* cfg：controls:{planet,air,height}、env:{planet,air,H}、graphs:['v','y']、towerH、wide、onEnd(env) */
  function fallScene(host, cfg) {
    var env = Object.assign({ planet: 'earth', air: false, H: 10 }, cfg.env || {});
    var ctl = cfg.controls || {}, show = { strobe: true }, t = 0, T = 1, vMax = 1, tl, tower, graphs = [];
    var objs = [{ name: '鐵球', tau: 4, draw: drawBall, x: 0.47 }, { name: '羽毛', tau: 0.2, draw: drawFeather, dash: [7, 4], x: 0.76 }];
    function g() { return env.planet === 'moon' ? G_MOON : G; }
    function hasAir() { return env.air && env.planet === 'earth'; }

    var top = h('div', { style: 'display:grid;grid-template-columns:' + (cfg.wide ? 300 : 250) + 'px minmax(0,1fr);gap:8px;align-items:start' });
    var towerBox = h('div', { class: 'stage' }), right = h('div', { class: 'stack', style: 'gap:6px' });
    top.appendChild(towerBox); top.appendChild(right); host.appendChild(top);

    /* 控制列 */
    var card = h('div', { class: 'card', style: 'padding:8px 10px' }), airSeg, note = h('div', { class: 'muted', style: 'margin-top:4px' });
    var row = h('div', { class: 'row' });
    if (ctl.planet) row.appendChild(Kit.seg([{ v: 'earth', label: '地球　g＝9.8' }, { v: 'moon', label: '月球　g≈1.63' }], env.planet, function (v) { env.planet = v; rebuild(); }));
    if (ctl.air) { airSeg = Kit.seg([{ v: 0, label: '真空（抽掉空氣）' }, { v: 1, label: '有空氣' }], env.air ? 1 : 0, function (v) { env.air = !!v; rebuild(); }); row.appendChild(airSeg); }
    var strobeBtn = h('button', { class: 'chip', 'aria-pressed': 'true', text: '頻閃影像', onclick: function () { show.strobe = !show.strobe; strobeBtn.setAttribute('aria-pressed', show.strobe ? 'true' : 'false'); paint(); } });
    if (row.children.length) card.appendChild(row);   /* 「頻閃影像」開關收進時間軸那一列 */
    if (ctl.height) { var cg = h('div', { class: 'ctrl', style: 'margin-top:4px' }); Kit.slider(cg, { label: '釋放高度', min: 5, max: 20, step: 1, value: env.H, unit: 'm', oninput: function (v) { env.H = v; rebuild(); } }); card.appendChild(cg); }
    card.appendChild(note);
    right.appendChild(card);

    /* 讀數表 */
    var cells = [], tbody = h('tbody');
    objs.forEach(function (o) {
      var c = [h('td'), h('td'), h('td')]; cells.push(c);
      tbody.appendChild(h('tr', null, [h('td', { style: 'white-space:nowrap', text: o.name + (o.dash ? ' ┅' : ' ━') })].concat(c)));
    });
    right.appendChild(h('div', { class: 'card', style: 'padding:4px 8px' }, h('table', { class: 'rec-table' }, [
      h('thead', null, h('tr', null, [h('th', { style: 'white-space:nowrap', text: '向下為正' }), h('th', { html: '<span class="sym-x">落下距離</span>' }), h('th', { html: '<span class="sym-v">速度 v（綠）</span>' }), h('th', { html: '<span class="sym-a">加速度 a（橘）</span>' })])), tbody
    ])));
    var gbox = h('div', { class: 'rec-graphs', style: cfg.wide ? 'grid-template-columns:1fr 1fr' : '' });
    right.appendChild(gbox);

    function series(key) { return objs.map(function (o) { return { f: o.m[key], color: key === 'v' ? C.v : C.x, dash: o.dash, name: o.name }; }); }
    function rebuild() {
      objs.forEach(function (o) { o.m = fallModel(g(), env.H, hasAir() ? o.tau : Infinity); });
      T = Math.ceil((Math.max(objs[0].m.tL, objs[1].m.tL) + 0.3) * 10) / 10;
      vMax = Math.sqrt(2 * g() * env.H);
      var knots = objs.map(function (o) { return o.m.tL; });
      graphs.forEach(function (gr) { gr.g.set({ series: series(gr.key), T: T, knots: knots }); });
      if (airSeg) { airSeg.set(hasAir() ? 1 : 0); airSeg.enable(1, env.planet === 'earth'); }
      note.textContent = env.planet === 'moon' ? '月球表面沒有空氣，所以只有真空的情形。' : hasAir() ? '有空氣：羽毛又輕又寬，空氣阻力對它的影響很大；鐵球受到的影響很小。' : '真空：兩個物體都只受重力。';
      if (tl) tl.setT(T); else paint();
    }
    function drawTower(c) {
      var ctx = c.ctx, W = c.W, H = c.H, y0 = 66, yG = H - 34, sc = (yG - y0) / env.H, moon = env.planet === 'moon', air = hasAir();
      var ink = moon ? '#e6edf5' : C.ink2, i, yy;
      ctx.fillStyle = moon ? '#1c2733' : air ? '#e8f3fb' : '#f4f6f9'; ctx.fillRect(0, 0, W, H);
      if (moon) { ctx.fillStyle = '#9fb0c2'; [[30, 20], [90, 34], [W - 40, 16], [W - 90, 40], [150, 14]].forEach(function (p) { ctx.fillRect(p[0], p[1], 2, 2); }); }
      ctx.fillStyle = moon ? '#7d8791' : '#b7c3ad'; ctx.fillRect(0, yG, W, H - yG);
      ctx.strokeStyle = moon ? '#aab4bf' : '#6f7d6a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, yG); ctx.lineTo(W, yG); ctx.stroke();
      /* 真空管 */
      if (!air && !moon) {
        ctx.strokeStyle = '#8fa6bb'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(255,255,255,.75)';
        ctx.beginPath(); ctx.rect(W * 0.33, y0 - 30, W * 0.57, yG - y0 + 30); ctx.fill(); ctx.stroke();
      }
      ctx.font = Kit.font(12, true); ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(moon ? '月球表面（沒有空氣）' : air ? '有空氣' : '真空管（已抽掉空氣）', W * 0.615, 4);
      /* 尺：落下距離 */
      var step = Kit.niceStep(env.H, 5);
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(44.5, y0); ctx.lineTo(44.5, yG); ctx.stroke();
      ctx.font = Kit.font(11); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (i = 0; i <= env.H + 1e-9; i += step) { yy = y0 + i * sc; ctx.beginPath(); ctx.moveTo(38, yy); ctx.lineTo(44, yy); ctx.stroke(); ctx.fillText(fmt(i), 34, yy); }
      ctx.save(); ctx.translate(11, (y0 + yG) / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.font = Kit.font(11, true); ctx.fillStyle = moon ? '#9cc4f2' : C.x; ctx.fillText('落下距離 (m)', 0, 0); ctx.restore();
      /* 物體、頻閃、箭頭 */
      objs.forEach(function (o) {
        var x = W * o.x, k, yy2 = y0 + o.m.y(t) * sc, v = o.m.v(t), a = o.m.a(t);
        /* 頻閃：每 0.2 s 留下一個位置記號 */
        if (show.strobe) for (k = 0; k * 0.2 <= Math.min(t, o.m.tL) + 1e-9; k++) {
          ctx.fillStyle = moon ? 'rgba(230,237,245,.55)' : 'rgba(61,82,105,.38)';
          ctx.beginPath(); ctx.arc(x, y0 + o.m.y(k * 0.2) * sc - 9, 3.5, 0, 6.3); ctx.fill();
        }
        o.draw(ctx, x, yy2, 1);
        /* 箭頭的尖端對齊物體，往上畫箭身，落地前不會插進地面 */
        var lv = v / vMax * 80, la = a / G * 34;
        Kit.arrow(ctx, x + 19, yy2 - 9 - lv, x + 19, yy2 - 9, moon ? '#3fd0a4' : C.v, { w: 3 });
        Kit.arrow(ctx, x - 19, yy2 - 9 - la, x - 19, yy2 - 9, moon ? '#ff8a4a' : C.a, { w: 3 });
        ctx.font = Kit.font(12, true); ctx.fillStyle = moon ? '#1c2733' : C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o.name, x, H - 16);
      });
    }
    function paint() {
      if (tower) tower.redraw();
      objs.forEach(function (o, i) {
        cells[i][0].textContent = fmt(o.m.y(t)) + ' m' + (t >= o.m.tL ? '（已落地）' : '');
        cells[i][1].textContent = fmt(o.m.v(t)) + ' m/s'; cells[i][2].textContent = fmt(o.m.a(t)) + ' m/s²';
      });
      graphs.forEach(function (gr) { gr.g.draw(t, {}); });
    }
    objs.forEach(function (o) { o.m = fallModel(g(), env.H, hasAir() ? o.tau : Infinity); });
    tower = Kit.canvas(towerBox, { h: cfg.towerH || 400, draw: drawTower });
    (cfg.graphs || ['v', 'y']).forEach(function (key) {
      graphs.push({
        key: key, g: Kit.graph(gbox, {
          kind: key === 'v' ? 'v' : 'x', series: series(key), T: 1, h: cfg.graphH || 150,
          title: key === 'v' ? 'v-t 圖　v (m/s)' : 'y-t 圖　落下距離 (m)', onScrub: function (tt) { tl.pause(); tl.set(tt); }
        })
      });
    });
    var tlHost = h('div', { class: 'card', style: 'padding:6px 8px;margin-top:8px' });
    host.appendChild(tlHost);
    rebuild();
    tl = Kit.timeline(tlHost, { T: T, step: 0.05, onChange: function (tt) { t = tt; paint(); }, onEnd: function () { if (cfg.onEnd) cfg.onEnd({ planet: env.planet, air: hasAir(), H: env.H }); } });
    tl.addTool(strobeBtn);
    tl.take.apply(null, [].slice.call(row.children));   /* 地球／月球、真空／空氣的切換也收進時間軸這一列（第四輪驗收第 3 點） */
    paint();
    return { env: env };
  }

  /* ======================================================================
   * 場景二：公式與 v-t 圖面積（認識 5）
   * ====================================================================== */
  function formulaScene(host) {
    var V0 = 4, A = 2, TT = 3, hl = '', c;
    var box = h('div', { class: 'stage' });
    host.appendChild(box);
    c = Kit.canvas(box, {
      h: 300, draw: function (c) {
        var ctx = c.ctx, W = c.W, H = c.H, L = 60, R = 30, T0 = 30, B = 40;
        function X(t) { return L + (W - L - R) * t / 3.5; }
        function Y(v) { return H - B - (H - T0 - B) * v / 12; }
        var i, vEnd = V0 + A * TT;
        ctx.clearRect(0, 0, W, H);
        ctx.font = Kit.font(11); ctx.strokeStyle = C.grid; ctx.fillStyle = C.ink2; ctx.lineWidth = 1;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        for (i = 0; i <= 12; i += 2) { ctx.beginPath(); ctx.moveTo(L, Y(i) + .5); ctx.lineTo(W - R, Y(i) + .5); ctx.stroke(); ctx.fillText(String(i), L - 6, Y(i)); }
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(X(i) + .5, T0); ctx.lineTo(X(i) + .5, H - B); ctx.stroke(); ctx.fillText(String(i), X(i), H - B + 6); }
        /* 長方形 v0·t 與三角形 ½at² */
        ctx.globalAlpha = hl === 'tri' ? .12 : .3; ctx.fillStyle = C.x; ctx.fillRect(X(0), Y(V0), X(TT) - X(0), Y(0) - Y(V0));
        ctx.globalAlpha = hl === 'rect' ? .12 : .3; ctx.fillStyle = '#5b9be6';
        ctx.beginPath(); ctx.moveTo(X(0), Y(V0)); ctx.lineTo(X(TT), Y(V0)); ctx.lineTo(X(TT), Y(vEnd)); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
        ctx.strokeStyle = C.x; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(X(0), Y(V0)); ctx.lineTo(X(TT), Y(V0)); ctx.moveTo(X(TT), Y(0)); ctx.lineTo(X(TT), Y(vEnd)); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = C.ink2; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(L, T0); ctx.lineTo(L, H - B); ctx.lineTo(W - R, H - B); ctx.stroke();
        ctx.strokeStyle = C.v; ctx.lineWidth = hl === 'line' ? 5 : 3; ctx.beginPath(); ctx.moveTo(X(0), Y(V0)); ctx.lineTo(X(TT), Y(vEnd)); ctx.stroke();
        ctx.fillStyle = C.v; [[0, V0], [TT, vEnd]].forEach(function (p) { ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 5, 0, 6.3); ctx.fill(); });
        ctx.font = Kit.font(13, true); ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
        ctx.fillStyle = C.x;
        ctx.fillText('長方形：v₀t ＝ 4×3 ＝ 12 m', X(1.5), Y(2));
        ctx.fillText('三角形：½at² ＝ ½×(2×3)×3 ＝ 9 m', X(1.95), Y(5.1));
        ctx.fillStyle = C.v; ctx.textAlign = 'left';
        ctx.fillText('v₀ ＝ 4 m/s', X(0) + 8, Y(V0) - 26);
        ctx.textAlign = 'right'; ctx.fillText('v ＝ 4＋2×3 ＝ 10 m/s', X(TT) - 8, Y(vEnd) - 4);
        ctx.fillStyle = C.a; ctx.textAlign = 'left'; ctx.fillText('斜率＝a＝2 m/s²', X(0.75), Y(8.3));
        ctx.fillStyle = C.v; ctx.font = Kit.font(13, true); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('v-t 圖　v (m/s)', 8, 6);
        ctx.fillStyle = C.ink3; ctx.textAlign = 'right'; ctx.font = Kit.font(11); ctx.fillText('t (s)', W - 6, H - B + 6);
      }
    });
    c.cv.classList.add('zoomable');
    function mark(k) { return function () { hl = k; c.redraw(); }; }
    var sol = h('div');
    host.appendChild(sol);
    Kit.solution(sol, {
      title: '例題：滑車初速 4 m/s，以 2 m/s² 等加速度前進 3 s，求末速與位移。', open: 1, steps: [
        { k: '已知', html: '<span class="sym-v">v₀</span>＝4 m/s，<span class="sym-a">a</span>＝2 m/s²，t＝3 s', on: mark('line'), onLabel: '看圖上的線' },
        { k: '公式', html: '求末速：<span class="sym-v">v</span>＝<span class="sym-v">v₀</span>＋<span class="sym-a">a</span>t' },
        { k: '代入', html: 'v＝4＋2×3＝<b>10 m/s</b>', on: mark('line'), onLabel: '看圖上的線' },
        { k: '公式', html: '求位移：<span class="sym-x">x</span>＝<span class="sym-v">v₀</span>t＋½<span class="sym-a">a</span>t²' },
        { k: '代入', html: 'x＝4×3＋½×2×3²＝12＋9＝<b>21 m</b>', on: mark(''), onLabel: '看兩塊面積' },
        { k: '檢查', html: 'v²＝v₀²＋2ax → 10²＝4²＋2×2×21＝100　✓' },
        { k: '答案', html: '末速 10 m/s，位移 21 m' }
      ]
    });
  }

  /* ======================================================================
   * 場景三：三條紙帶（探究 3）
   * ====================================================================== */
  var TAPES = [
    { name: '甲', gaps: [8, 8, 8, 8, 8], dash: null },
    { name: '乙', gaps: [2, 3, 4, 5, 6], dash: [8, 4] },
    { name: '丙', gaps: [1, 3, 5, 7, 9], dash: [2, 4] }
  ];
  function drawTapes(c, sel) {
    var ctx = c.ctx, W = c.W, sc = (W - 90) / 40;
    ctx.clearRect(0, 0, c.W, c.H);
    TAPES.forEach(function (tp, i) {
      var y = 22 + i * 62, x = 56, pts = [x];
      tp.gaps.forEach(function (g) { x += g * sc; pts.push(x); });
      if (sel === i) { ctx.fillStyle = '#e3effc'; ctx.fillRect(0, y - 16, W, 58); }
      Kit.tape(ctx, 44, y, W - 56, 22, pts);
      ctx.font = Kit.font(16, true); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(tp.name, 22, y + 11);
      if (sel === i) {
        ctx.font = Kit.font(12, true); ctx.fillStyle = C.x; ctx.textBaseline = 'top';
        tp.gaps.forEach(function (g, k) { ctx.fillText(String(g), (pts[k] + pts[k + 1]) / 2, y + 26); });
        ctx.textAlign = 'right'; ctx.fillText('點距（cm）', W - 8, y + 26); ctx.textAlign = 'center';
      }
    });
    ctx.font = Kit.font(11); ctx.fillStyle = C.ink3; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
